name: CI/CD Production Deployment

on:
  push:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Pindah ke direktori aplikasi
            cd /var/www/sinyal-saham-ai || exit 1
            
            # Tarik kode terbaru dari repositori git
            git pull origin main
            
            # Restart docker containers dengan pembaharuan build
            docker compose down
            docker compose up -d --build
            
            # Jalankan migrasi database jika ada
            docker exec sinyal_backend alembic upgrade head || true
            
            echo "Aplikasi Sinyal Saham AI berhasil di-update ke versi terbaru."
