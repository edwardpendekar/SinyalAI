version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sinyal_db_local
    restart: always
    environment:
      POSTGRES_DB: sinyal_ai
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: securepassword123
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinyal_backend_local
    restart: always
    environment:
      - DATABASE_URL=postgresql://quant_user:securepassword123@db/sinyal_ai
      - GEMINI_API_KEY=your_gemini_api_key_here
      - TELEGRAM_BOT_TOKEN=your_telegram_bot_token_here
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sinyal_frontend_local
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata_local:
