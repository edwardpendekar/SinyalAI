version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sinyal_db
    restart: always
    environment:
      POSTGRES_DB: sinyal_ai
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: securepassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinyal_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://quant_user:securepassword123@db/sinyal_ai
      - ALPHA_VANTAGE_API_KEY=your_key_here
      - POLYGON_API_KEY=your_key_here
      - GEMINI_API_KEY=your_key_here
      - TELEGRAM_BOT_TOKEN=your_token_here
    expose:
      - "8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sinyal_frontend
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: sinyal_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: sinyal_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit 0; sigterm; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
